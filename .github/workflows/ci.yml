name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Setup dotnet-version 11.0.x
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - name: Display dotnet version
        run: dotnet --version
      - name: Restore dependencies
        run: dotnet restore 
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 11.0.0
      - name: Check for missing migrations
        run: dotnet ef migrations has-pending-model-changes --project src/SeatFlow.Infrastructure --startup-project src/SeatFlow.Api --configuration Release --no-build
        env:
          # Not a real database: the check never connects, the app only needs a value to start.
          ConnectionStrings__SeatFlow: Host=localhost;Database=ci;Username=ci;Password=ci
      - name: Test
        run: dotnet test --no-build --configuration Release

  frontend:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
